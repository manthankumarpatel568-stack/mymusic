<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Beats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Rain Effect -->
    <div class="rain"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h1>☕ Cafe Beats</h1>
    </aside>

    <!-- Theme Button -->
    <button id="themeToggle" onclick="toggleTheme()">☀️</button>

    <!-- Online Counter -->
    <div id="onlineCounter">
        🟢 <span id="onlineCount">0</span> Online
    </div>

    <!-- Live Clock -->
    <div id="liveClock">
        0:00:00 PM
    </div>

    <!-- Coffee Animation -->
    <div class="coffee-animation">

        <div class="steam steam1"></div>
        <div class="steam steam2"></div>
        <div class="steam steam3"></div>

        <div class="coffee-cup">
            <div class="coffee"></div>
            <div class="cup-handle"></div>
        </div>

        <div class="saucer"></div>

    </div>

    <!-- Visualizer -->
    <main>
        <canvas id="visualizer"></canvas>
    </main>

    <!-- Sleep Timer -->
    <div class="sleep-timer">

        <span>⏱️ Sleep Timer</span>

        <select id="sleepTime" onchange="setSleepTimer()">
            <option value="0">Off</option>
            <option value="15">15 Minutes</option>
            <option value="30">30 Minutes</option>
            <option value="60">60 Minutes</option>
        </select>

        <span id="sleepStatus"></span>

    </div>

    <!-- Music Player -->
    <div class="player">

        <!-- Current Song -->
        <div class="current-song">

            <img
                id="playerImage"
                src="https://picsum.photos/60?random=2"
                alt="Song cover"
            >

            <div>
                <b id="songTitle">Be Intehaan</b>
                <small id="artist">Atif Aslam</small>
            </div>

        </div>

        <!-- Controls -->
        <div class="controls">

            <div class="buttons">

                <button onclick="previousSong()">⏮</button>

                <button
                    id="playBtn"
                    onclick="togglePlay()"
                >
                    ▶
                </button>

                <button onclick="nextSong()">⏭</button>

            </div>

            <!-- Progress -->
            <div class="progress-area">

                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">0:00</span>

            </div>

        </div>

        <!-- Right Controls -->
        <div class="right-controls">

            <!-- Shuffle Button -->
            <button
                id="shuffleBtn"
                onclick="toggleShuffle()"
                title="Shuffle"
            >
                🔀
            </button>

            <!-- Volume -->
            <div class="volume">

                🔊

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>

        </div>

    </div>

    <!-- Audio -->
    <audio id="audio"></audio>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
