<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyMusic</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h1>🎵 MyMusic</h1>

        <div class="menu">

            <p>🏠 Home</p>

            <p>🔍 Search</p>

            <p>📚 Your Library</p>

            <p>❤️ Favorites</p>

        </div>

    </aside>



    <!-- MAIN CONTENT -->

    <main>

        <header>

            <h2>Good Afternoon 👋</h2>

            <p>
                Listen to your favourite music
            </p>

        </header>

    </main>



    <!-- MUSIC PLAYER -->

    <div class="player">


        <!-- CURRENT SONG -->

        <div class="current-song">

            <img
                id="playerImage"
                src="https://picsum.photos/60?random=1"
                alt="Cover"
            >

            <div>

                <b id="songTitle">
                    My First Song
                </b>

                <small id="artist">
                    Artist Name
                </small>

            </div>

        </div>



        <!-- PLAYER CONTROLS -->

        <div class="controls">

            <div class="buttons">

                <button onclick="previousSong()">
                    ⏮
                </button>


                <button
                    id="playBtn"
                    onclick="togglePlay()"
                >
                    ▶
                </button>


                <button onclick="nextSong()">
                    ⏭
                </button>

            </div>



            <!-- PROGRESS BAR -->

            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>


                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >


                <span id="duration">
                    0:00
                </span>

            </div>

        </div>



        <!-- VOLUME -->

        <div class="volume">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>



    <!-- AUDIO -->

    <audio id="audio"></audio>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
