<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Beats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>☕ Cafe Beats</h1>
    </aside>


    <!-- MAIN CONTENT -->
    <main>

        <!-- ONLINE COUNTER -->
        <div id="onlineCounter">
            🟢 <span id="onlineCount">0</span> Online
        </div>

        <!-- LIVE CLOCK -->
        <div id="liveClock">
            0:00:00 PM
        </div>


        <header>
            <h2>Good Afternoon 👋</h2>
            <p>Listen to your favourite music</p>
        </header>

    </main>


    <!-- MUSIC PLAYER -->
    <div class="player">

        <!-- CURRENT SONG -->
        <div class="current-song">

            <img
                id="playerImage"
                src="https://picsum.photos/60?random=2"
                alt="Song cover"
            >

            <div>

                <b id="songTitle">
                    Be Intehaan
                </b>

                <small id="artist">
                    Atif Aslam
                </small>

            </div>

        </div>


        <!-- PLAYER CONTROLS -->
        <div class="controls">

            <div class="buttons">

                <button onclick="previousSong()">
                    ⏮
                </button>

                <button
                    id="playBtn"
                    onclick="togglePlay()"
                >
                    ▶
                </button>

                <button onclick="nextSong()">
                    ⏭
                </button>

            </div>


            <!-- PROGRESS -->
            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- VOLUME -->
        <div class="volume">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>


    <!-- AUDIO -->
    <audio id="audio"></audio>


    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
